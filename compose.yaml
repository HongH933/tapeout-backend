services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tapemarket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - tapemarket-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tapemarket"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    command: ["node", "dist/src/db/migrate.js"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tapemarket
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: .
    command: ["node", "dist/src/server.js"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tapemarket
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  worker:
    build: .
    command: ["node", "dist/src/worker.js"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tapemarket
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  tapemarket-postgres:
